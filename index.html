<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think Culture</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrollbars */
            background-color: #0d0f12; /* Dark sleek background */
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-4 sm:p-8 antialiased select-none">

    <!-- Container for centering and containing the image -->
    <main class="w-full h-full flex items-center justify-center relative">
        <img 
            src="Think Culture.png" 
            alt="Think Culture" 
            class="max-w-full max-h-full object-contain drop-shadow-2xl rounded-lg transition-all duration-300"
            onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\"text-center text-gray-400 font-sans p-6 rounded-2xl bg-gray-900/50 border border-gray-800\"><p class=\"text-lg font-bold text-gray-200 mb-1\">Image Not Found</p><p class=\"text-xs text-gray-400\">Please ensure <code class=\"text-emerald-400 bg-black/40 px-2 py-0.5 rounded\">Think Culture.png</code> is placed in the root directory.</p></div>';"
        />
    </main>

</body>
</html>
